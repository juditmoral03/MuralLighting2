events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    # WebSocket mapping (necessary for NiceGUI and some Node frameworks)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # Listen on port 10000 (will be replaced in start.sh)
        listen 10000;
        server_name localhost;

        # --- ROUTE 1: Node.js (The "rest" of the content) ---
        # Everything starting with /app/ is sent to Node
        location /app/ {
            # Remove the /app/ prefix before sending to Node if your Node app doesn't expect the prefix
            # rewrite ^/app/(.*) /$1 break; 
            
            proxy_pass http://127.0.0.1:3006/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # --- ROUTE 2: NiceGUI (The main menu) ---
        # The root goes to Python
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}