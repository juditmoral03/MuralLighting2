<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            overflow: hidden;
            margin: 0px;
            display: flex;
            background-color: #000;
        }

        .threejs-window {
            width: 50%;
            height: 100vh;
        }

        .dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            justify-content: center;
            align-items: center;
            pointer-events: all;
            z-index: 1000;
        }

        .dialog-content {
            background-color: #fff;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            width: 40%;
            height: 90%;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
            position: relative;
            z-index: 1001;
        }

        .dialog-header {
            cursor: grab;
            background: #f1f1f1;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }

        .close-button {
            position: absolute;
            top: -2px;
            right: 5px;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        /* Estilo base para el borde */
        .image-frame {
            border: 5px solid transparent; /* Transparente por defecto */
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box; /* Importante para que el borde no cambie el tamaño */
        }

        /* Estilo cuando está seleccionada (quitamos la clase 'hidden') */
        .image-frame.selected {
            border-color: #fffc54;
            box-shadow: 0 0 15px white;
        }
        
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.2/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "./build/three.module.js"
            }
        }
    </script>
</head>

<body>
    <div id="window1" class="threejs-window image-frame"></div>
    <div id="window2" class="threejs-window image-frame"></div>

    <div id="differenceDialog" class="dialog">
        <div id="differenceView" class="dialog-content">
            <div id="drag-handle" class="dialog-header"></div>
            <span id="closeDialog" class="close-button">&times;</span>
            <div id="winDiff" style="width:100%; height:95%" class="threejs-window"></div>
        </div>
    </div>

    <script type="module" src="client.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const containerL = document.getElementById('window1');
            const containerR = document.getElementById('window2');

            // Función para actualizar SOLO la parte visual (bordes)
            function updateVisualSelection(selected) {
                // 1. Limpiamos ambos primero
                containerL.classList.remove('selected');
                containerR.classList.remove('selected');

                // 2. Activamos solo el que toque (si no es null)
                if (selected === 'left') {
                    containerL.classList.add('selected');
                } else if (selected === 'right') {
                    containerR.classList.add('selected');
                }
            }

            // Función central que gestiona la lógica de selección/deselección
            function handleSelection(clickedWindow) {
                // Leer qué tenemos guardado ahora mismo
                const currentSelection = localStorage.getItem('selectedWindow');
                let finalSelection = clickedWindow;

                // --- LÓGICA DE TOGGLE (INTERRUPTOR) ---
                // Si lo que he clicado es igual a lo que ya tenía seleccionado...
                if (currentSelection === clickedWindow) {
                    finalSelection = null; // ...entonces lo deselecciono.
                    console.log("Deseleccionando ventana");
                } else {
                    console.log("Seleccionando:", finalSelection);
                }

                // 1. Guardar o borrar en localStorage
                if (finalSelection) {
                    localStorage.setItem('selectedWindow', finalSelection);
                } else {
                    localStorage.removeItem('selectedWindow');
                }

                // 2. Actualizar visuales (bordes amarillos)
                updateVisualSelection(finalSelection);

                // 3. Avisar a Python (NiceGUI)
                window.parent.postMessage({ type: 'window_selected', value: finalSelection }, '*');
            }

            // Restaurar estado al cargar la página
            const saved = localStorage.getItem('selectedWindow');
            if (saved) updateVisualSelection(saved);

            // Listeners simplificados
            containerL.addEventListener('click', () => handleSelection('left'));
            containerR.addEventListener('click', () => handleSelection('right'));
        });
    </script>

</body>
</html>
